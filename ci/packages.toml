# ci/packages.toml — the base-pkgs build registry + sweep-feed config.
#
# Consumed by ci/matrix.py (build selection) and ci/sweep/sweep.py (version
# sweep). One table per package; **a package without an entry is not built**.
# The specs themselves live in pkgs/<pkg>/<pkg>.spec.
#
# Batches are dependency levels, not parallel groups within one job:
# copr-build.yml submits the waves sequentially and waits for each wave's
# Copr builds before the next — each successful build is immediately visible
# to the project repo, so a package may rely on anything built in a lower
# batch. Packages inside one batch must therefore never depend on each other.
#
# Build-time dependencies that Fedora 44 does not provide: glaze, hyprwire
# and hyprtoolkit are packaged in THIS repo (ports of the lionheartp/Hyprland
# Copr specs; the fourth input, wlroots, ships in Fedora 44 itself). The
# lionheartp Copr stays configured on the Copr chroot only as a lowest-
# priority bootstrap for fresh projects; once our own builds exist, the
# project repo wins.
#
# batch 0  roots: Fedora-only build deps and leaf tools (hyprutils,
#          hyprwayland-scanner, hyprland-protocols, glaze, pyprland,
#          nwg-displays, xcur2png, qt6ct, adw-gtk3)
# batch 1  first level: hyprlang, aquamarine, hyprgraphics, hyprwire,
#          noctalia-greeter-git, nwg-look (runtime-requires xcur2png)
# batch 2  second level: hyprcursor, hyprland-qt-support, hyprtoolkit,
#          xdg-desktop-portal-hyprland
# batch 3  third level: hyprland-git, hyprland-guiutils, hyprpwcenter,
#          hyprshutdown, noctalia-git
# The optional [pkg.updates] table drives the daily sweep (update.yml):
#   feed = "github-release"  + repo = "owner/name"   latest GitHub release tag
#   feed = "github-tag"      + repo = "owner/name"   newest git tag
#   feed = "custom"          + custom = "<name>"     ci/sweep/custom.py function

# --------------------------------------------------------------- desktops

# --- batch 0 ------------------------------------------------------------
[hyprutils]
batch = 0

[hyprutils.updates]
feed = "github-release"
repo = "hyprwm/hyprutils"

[hyprwayland-scanner]
batch = 0

[hyprwayland-scanner.updates]
feed = "github-release"
repo = "hyprwm/hyprwayland-scanner"

[hyprland-protocols]
batch = 0

[hyprland-protocols.updates]
feed = "github-release"
repo = "hyprwm/hyprland-protocols"

# glaze: header-only JSON library (provides glaze-static/glaze-devel for
# hyprland and hyprshutdown). Ported from LionHeartP/hyprlandRPM.
[glaze]
batch = 0

[glaze.updates]
feed = "github-release"
repo = "stephenberry/glaze"

# pyprland: Hyprland companion daemon (hatchling wheel + compiled C client,
# per the AUR PKGBUILD); version sweeps the git tags.
[pyprland]
batch = 0

[pyprland.updates]
feed = "github-tag"
repo = "hyprland-community/pyprland"

# --- batch 1 ------------------------------------------------------------
# hyprlang needs hyprutils (batch 0), so it sits in batch 1.
[hyprlang]
batch = 1

[hyprlang.updates]
feed = "github-release"
repo = "hyprwm/hyprlang"

[aquamarine]
batch = 1

[aquamarine.updates]
feed = "github-release"
repo = "hyprwm/aquamarine"

[hyprgraphics]
batch = 1

[hyprgraphics.updates]
feed = "github-release"
repo = "hyprwm/hyprgraphics"

# hyprwire: hyprland's wire-protocol IPC library (needs hyprutils).
[hyprwire]
batch = 1

[hyprwire.updates]
feed = "github-release"
repo = "hyprwm/hyprwire"

# noctalia-greeter: standalone greeter (all build deps in Fedora 44).
[noctalia-greeter-git]
batch = 1

[noctalia-greeter-git.updates]
feed = "custom"
custom = "noctalia-greeter-git"

# --- batch 2 ------------------------------------------------------------
# hyprcursor needs hyprlang (batch 1).
[hyprcursor]
batch = 2

[hyprcursor.updates]
feed = "github-release"
repo = "hyprwm/hyprcursor"

# hyprland-qt-support needs hyprlang (batch 1).
[hyprland-qt-support]
batch = 2

[hyprland-qt-support.updates]
feed = "github-release"
repo = "hyprwm/hyprland-qt-support"

# xdg-desktop-portal-hyprland needs hyprlang (batch 1) + batch 0 protocols/utils.
[xdg-desktop-portal-hyprland]
batch = 2

[xdg-desktop-portal-hyprland.updates]
feed = "custom"
custom = "xdg-desktop-portal-hyprland"

# hyprtoolkit: GUI toolkit for guiutils/pwcenter/shutdown (needs
# aquamarine + hyprgraphics + hyprlang from batch 1).
[hyprtoolkit]
batch = 2

[hyprtoolkit.updates]
feed = "github-release"
repo = "hyprwm/hyprtoolkit"

# --- batch 3 ------------------------------------------------------------
# hyprland-git: needs glaze (batch 0), hyprwire (batch 1), hyprcursor (batch 2).
[hyprland-git]
batch = 3

[hyprland-git.updates]
feed = "custom"
custom = "hyprland-git"

# noctalia-git: the desktop shell itself, git-tracked.
[noctalia-git]
batch = 3

[noctalia-git.updates]
feed = "custom"
custom = "noctalia-git"

# the hyprtoolkit dependents: hyprtoolkit is batch 2, these wait for
# it to publish.
[hyprland-guiutils]
batch = 3

[hyprland-guiutils.updates]
feed = "github-release"
repo = "hyprwm/hyprland-guiutils"

[hyprpwcenter]
batch = 3

[hyprpwcenter.updates]
feed = "github-release"
repo = "hyprwm/hyprpwcenter"

[hyprshutdown]
batch = 3

[hyprshutdown.updates]
feed = "github-release"
repo = "hyprwm/hyprshutdown"

# nwg-displays: pure-Python nwg-shell output configurator (upstream:
# nwg-piotr/nwg-displays); version follows the newest git tag.
[nwg-displays]
batch = 0

[nwg-displays.updates]
feed = "github-tag"
repo = "nwg-piotr/nwg-displays"

# xcur2png: converts X cursor files to PNGs — nwg-look shells out to it for
# cursor previews and Fedora ships no package (ported from
# LionHeartP/hyprlandRPM, alpha-math patch included).
[xcur2png]
batch = 0

[xcur2png.updates]
feed = "github-release"
repo = "eworm-de/xcur2png"

[nwg-look]
batch = 1

[nwg-look.updates]
feed = "github-release"
repo = "nwg-piotr/nwg-look"

[qt6ct]
batch = 0

[qt6ct.updates]
feed = "custom"
custom = "qt6ct"

# adw-gtk3: GTK3 theme styled after Libadwaita, vendored from the upstream
# prebuilt release bundle (v6.x builds via meson + dart-sass, which Fedora
# does not package — hence the bundle, not a source build).
[adw-gtk3]
batch = 0

[adw-gtk3.updates]
feed = "github-release"
repo = "lassekongo83/adw-gtk3"


